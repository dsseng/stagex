name: core

on: workflow_dispatch

jobs:
  build-push:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Enable snapshotter
        run: |
          cat << ENDHERE >/tmp/daemon.json
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
          ENDHERE
          
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preseed
        run: |
          ./src/preseed-pkg.sh bootstrap-stage3 ghcr.io/dsseng/stagex-bootstrap-stage3:latest
          ./src/preseed-pkg.sh core-filesystem ghcr.io/dsseng/stagex-core-filesystem:latest
      - name: Build and push binutils
        run: |
          make binutils PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          env -C out/core-binutils tar -c . | docker load
          docker tag stagex/core-binutils:2.43.1 ghcr.io/dsseng/stagex-core-binutils:2.43.1
          docker push ghcr.io/dsseng/stagex-core-binutils:2.43.1
      - name: Build and push busybox
        run: |
          make busybox PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          env -C out/core-busybox tar -c . | docker load
          docker tag stagex/core-busybox:1.36.1 ghcr.io/dsseng/stagex-core-busybox:1.36.1
          docker push ghcr.io/dsseng/stagex-core-busybox:1.36.1
      - name: Build and push gcc
        run: |
          make gcc PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          env -C out/core-gcc tar -c . | docker load
          docker tag stagex/core-gcc:13.1.0 ghcr.io/dsseng/stagex-core-gcc:13.1.0
          docker push ghcr.io/dsseng/stagex-core-gcc:13.1.0
      - name: Build and push make
        run: |
          make make PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          env -C out/core-make tar -c . | docker load
          docker tag stagex/core-make:4.4 ghcr.io/dsseng/stagex-core-make:4.4
          docker push ghcr.io/dsseng/stagex-core-make:4.4
      - name: Build and push musl
        run: |
          make musl PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          env -C out/core-musl tar -c . | docker load
          docker tag stagex/core-musl:1.2.4 ghcr.io/dsseng/stagex-core-musl:1.2.4
          docker push ghcr.io/dsseng/stagex-core-musl:1.2.4
