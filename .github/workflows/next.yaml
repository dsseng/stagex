name: next

on: workflow_dispatch

jobs:
  build-push:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Enable snapshotter
        run: |
          cat << ENDHERE >/tmp/daemon.json
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
          ENDHERE
          
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preseed
        run: |
          ./src/preseed-pkg.sh bootstrap-stage3 ghcr.io/dsseng/stagex-bootstrap-stage3:latest
          ./src/preseed-pkg.sh core-filesystem ghcr.io/dsseng/stagex-core-filesystem:latest
          ./src/preseed-pkg.sh core-binutils ghcr.io/dsseng/stagex-core-binutils:2.43.1
          ./src/preseed-pkg.sh core-busybox ghcr.io/dsseng/stagex-core-busybox:1.36.1
          ./src/preseed-pkg.sh core-gcc ghcr.io/dsseng/stagex-core-gcc:13.1.0
          ./src/preseed-pkg.sh core-make ghcr.io/dsseng/stagex-core-make:4.4
          ./src/preseed-pkg.sh core-musl ghcr.io/dsseng/stagex-core-musl:1.2.4
      - name: Build and push diffutils
        run: |
          make diffutils PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          ./src/publish-pkg.sh core-diffutils 3.10
      - name: Build and push go
        run: |
          make go PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          ./src/publish-pkg.sh core-go 1.23.1
      - name: Build and push perl
        run: |
          make perl PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          ./src/publish-pkg.sh core-perl 5.38.0
      - name: Build and push texinfo
        run: |
          make texinfo PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          ./src/publish-pkg.sh core-texinfo 7.1
