name: ci

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:

jobs:
  build-push:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Enable snapshotter
        run: |
          cat << ENDHERE >/tmp/daemon.json
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
          ENDHERE
          
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build stage0
        run: |
          make stage0 PROGRESS=plain PLATFORM=linux/386
      - name: Push stage0
        run: |
          env -C out/bootstrap-stage0 tar -c . | docker load
          docker tag stagex/bootstrap-stage0:latest ghcr.io/dsseng/stagex-bootstrap-stage0:latest
          docker push ghcr.io/dsseng/stagex-bootstrap-stage0:latest
      - name: Build bootstrap
        run: |
          make stage1 PROGRESS=plain PLATFORM=linux/386
          make stage2 stage3 PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
      - name: Push bootstrap
        run: |
          env -C out/bootstrap-stage1 tar -c . | docker load
          docker tag stagex/bootstrap-stage1:fc6eeb6bd75ea0d0025a79ea9fe45614bd60ba14 ghcr.io/dsseng/stagex-bootstrap-stage1:fc6eeb6bd75ea0d0025a79ea9fe45614bd60ba14
          docker push ghcr.io/dsseng/stagex-bootstrap-stage1:fc6eeb6bd75ea0d0025a79ea9fe45614bd60ba14
          env -C out/bootstrap-stage2 tar -c . | docker load
          docker tag stagex/bootstrap-stage2:latest ghcr.io/dsseng/stagex-bootstrap-stage2:latest
          docker push ghcr.io/dsseng/stagex-bootstrap-stage2:latest
          env -C out/bootstrap-stage3 tar -c . | docker load
          docker tag stagex/bootstrap-stage3:latest ghcr.io/dsseng/stagex-bootstrap-stage3:latest
          docker push ghcr.io/dsseng/stagex-bootstrap-stage3:latest
      - name: Build core
        run: |
          make binutils busybox diffutils gcc go make musl perl texinfo PLATFORM=linux/amd64,linux/arm64
      - name: Push core
        run: |
          env -C out/core-binutils tar -c . | docker load
          docker tag stagex/core-binutils:2.43.1 ghcr.io/dsseng/stagex-core-binutils:2.43.1
          docker push ghcr.io/dsseng/stagex-core-binutils:2.43.1
          env -C out/core-busybox tar -c . | docker load
          docker tag stagex/core-busybox:1.36.1 ghcr.io/dsseng/stagex-core-busybox:1.36.1
          docker push ghcr.io/dsseng/stagex-core-busybox:1.36.1
          env -C out/core-diffutils tar -c . | docker load
          docker tag stagex/core-diffutils:3.10 ghcr.io/dsseng/stagex-core-diffutils:3.10
          docker push ghcr.io/dsseng/stagex-core-diffutils:3.10
          env -C out/core-gcc tar -c . | docker load
          docker tag stagex/core-gcc:13.1.0 ghcr.io/dsseng/stagex-core-gcc:13.1.0
          docker push ghcr.io/dsseng/stagex-core-gcc:13.1.0
          env -C out/core-go tar -c . | docker load
          docker tag stagex/core-go:1.23.1 ghcr.io/dsseng/stagex-core-go:1.23.1
          docker push ghcr.io/dsseng/stagex-core-go:1.23.1
          env -C out/core-make tar -c . | docker load
          docker tag stagex/core-make:4.4 ghcr.io/dsseng/stagex-core-make:4.4
          docker push ghcr.io/dsseng/stagex-core-make:4.4
          env -C out/core-musl tar -c . | docker load
          docker tag stagex/core-musl:1.2.4 ghcr.io/dsseng/stagex-core-musl:1.2.4
          docker push ghcr.io/dsseng/stagex-core-musl:1.2.4
          env -C out/core-perl tar -c . | docker load
          docker tag stagex/core-perl:5.38.0 ghcr.io/dsseng/stagex-core-perl:5.38.0
          docker push ghcr.io/dsseng/stagex-core-perl:5.38.0
          env -C out/core-texinfo tar -c . | docker load
          docker tag stagex/core-texinfo:7.1 ghcr.io/dsseng/stagex-core-texinfo:7.1
          docker push ghcr.io/dsseng/stagex-core-texinfo:7.1
