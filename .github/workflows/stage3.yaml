name: stage3

on: workflow_dispatch

jobs:
  build-push:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Enable snapshotter
        run: |
          cat << ENDHERE >/tmp/daemon.json
          {
            "features": {
              "containerd-snapshotter": true
            }
          }
          ENDHERE
          
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preseed
        run: |
          ./src/preseed-pkg.sh bootstrap-stage2 ghcr.io/dsseng/stagex-bootstrap-stage2:latest
      - name: Build and push stage3
        run: |
          make stage3 PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
          env -C out/bootstrap-stage3 tar -c . | docker load
          docker tag stagex/bootstrap-stage3:latest ghcr.io/dsseng/stagex-bootstrap-stage3:latest
          docker push ghcr.io/dsseng/stagex-bootstrap-stage3:latest
